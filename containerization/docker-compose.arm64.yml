x-api: &api
  build:
    context: ..
    dockerfile: containerization/Dockerfile.arm64
  environment:
    PORT: "8080"
    DATA_DIR: "/data"
  volumes:
    - ../data:/data:ro
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
    interval: 3s
    timeout: 2s
    retries: 30

services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

  api1:
    <<: *api

  api2:
    <<: *api
