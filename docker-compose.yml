x-api: &api
  image: zanfranceschi/rinha-de-backend-2026-clojure-exempl:202604122302
  environment:
    PORT: "3000"
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: "200M"

services:
  api1:
    <<: *api

  api2:
    <<: *api

  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./rogue-data:/rogue-data
    command: sh -c "mkdir -p /rogue-data && touch /rogue-data/root-owned.txt && nginx -g 'daemon off;'"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"
